<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Naive vs Stream - Memory Usage</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/luxon@3.4.4/build/global/luxon.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1.3.1/dist/chartjs-adapter-luxon.umd.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      gap: 2rem;
      padding: 2rem;
      background: #f4f4f4;
    }
    .chart-container {
      margin-top: 150px;
      width: 100%;
      max-width: 1000px;
      background: white;
      padding: 1rem;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    canvas {
      width: 100% !important;
      height: 400px !important;
    }
  </style>
</head>
<body>
  <div class="chart-container">
    <h3>Naive</h3>
    <canvas id="chartNaive"></canvas>
  </div>

  <div class="chart-container">
    <h3>Stream</h3>
    <canvas id="chartStream"></canvas>
  </div>

  <script>
    function createChart(ctx, label) {
      return new Chart(ctx, {
        type: 'line',
        data: {
          datasets: [
            { label: 'RSS', data: [], borderColor: 'rgb(255, 99, 132)', tension: 0.2 },
            { label: 'Heap Used', data: [], borderColor: 'rgb(54, 162, 235)', tension: 0.2 },
            { label: 'External', data: [], borderColor: 'rgb(255, 206, 86)', tension: 0.2 }
          ]
        },
        options: {
          animation: false,
          responsive: true,
          scales: {
            x: {
              type: 'time',
              time: { unit: 'second', tooltipFormat: 'HH:mm:ss' }
            },
            y: {
              beginAtZero: true,
              title: { display: true, text: 'Memory (MB)' }
            }
          },
          plugins: { legend: { position: 'top' } }
        }
      });
    }

    const chartNaive = createChart(document.getElementById('chartNaive').getContext('2d'));
    const chartStream = createChart(document.getElementById('chartStream').getContext('2d'));

    function connectWS(url, chart) {
      const socket = new WebSocket(url);
      socket.onmessage = (event) => {
        const point = JSON.parse(event.data);
        const t = new Date(point.timestamp);

        chart.data.datasets[0].data.push({ x: t, y: parseFloat(point.rss) });
        chart.data.datasets[1].data.push({ x: t, y: parseFloat(point.heapUsed) });
        chart.data.datasets[2].data.push({ x: t, y: parseFloat(point.external) });

        chart.data.datasets.forEach(ds => {
          if (ds.data.length > 30) ds.data.shift();
        });

        chart.update();
      };
    }

    connectWS("ws://localhost:3001", chartNaive);
    connectWS("ws://localhost:3002", chartStream);
  </script>
</body>
</html>
